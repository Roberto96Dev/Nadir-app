<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Cyber Agenda 2026</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Nadir">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.imgur.com/vHnxP8z.png">
</head>
<body>
    <div class="bg-glow"></div>
    <h1>NADIR</h1>
    <button id="themeToggle" onclick="toggleTheme()">🌙 Modalità Notte</button>

    <div class="main-wrapper">
        <!-- Agenda -->
        <div class="container agenda-box">
            <h1>📅 Agenda</h1>
            <div class="input-section">
                <input type="text" id="taskInput" placeholder="Cosa devi fare?">
                <div class="datetime-row">
                    <input type="date" id="dateInput">
                    <input type="time" id="timeInput">
                </div>
                <select id="categoryInput">
                    <option value="Personale">🏠 Personale</option>
                    <option value="Lavoro">💼 Lavoro</option>
                    <option value="Studio">📚 Studio</option>
                    <option value="Sport">🏃 Sport</option>
                </select>
                <button onclick="addTask()" class="btn-main">Aggiungi</button>
            </div>
        </div>

        <!-- Calendario -->
        <div class="container calendar-box">
            <div class="calendar-header">
                <button onclick="changeMonth(-1)" class="btn-nav">❮</button>
                <h2 id="monthDisplay"></h2>
                <button onclick="changeMonth(1)" class="btn-nav">❯</button>
            </div>
            <div class="calendar-grid-header">
                <span>Lu</span><span>Ma</span><span>Me</span><span>Gi</span><span>Ve</span><span>Sa</span><span>Do</span>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <!-- Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3 id="modalDateTitle">Impegni</h3>
            <ul id="modalTaskList"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
